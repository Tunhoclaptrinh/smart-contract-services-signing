name: CI
on:
  push:
  pull_request:
  # Run by hand from the Actions tab (or `gh workflow run CI`), for example after a settings change.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: btl
          POSTGRES_PASSWORD: btl-ci
          POSTGRES_DB: btl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U btl -d btl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://btl:btl-ci@127.0.0.1:5432/btl
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the base check compares against the merge base with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Base files unchanged outside the base flow
        run: node scripts/check-base-untouched.mjs
      - name: Docs updated with the code
        run: node scripts/check-docs-updated.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: API smoke
        run: |
          API_PORT=3000 STORAGE_DRIVER=file DATA_DIR=/tmp/btl-ci node service/dist/main.js > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the API image
        run: |
          docker build -f service/Dockerfile -t sc/service .
          docker network create btl
          docker run -d --name db --network btl -e POSTGRES_USER=btl -e POSTGRES_PASSWORD=btl-ci -e POSTGRES_DB=btl postgres:17.6
          until docker exec db pg_isready -U btl -d btl; do sleep 1; done
          # Production refuses file storage, so the image runs on PostgreSQL as it would deployed.
          docker run -d --name api --network btl -p 3000:3000 \
            -e STORAGE_DRIVER=postgres -e DATABASE_URL=postgres://btl:btl-ci@db:5432/btl \
            -e JWT_PRIVATE_KEY="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)" \
            -e SEED_PASSWORD=Passw0rd! sc/service
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  # The whole stack through the gateway (MS-R7, MS-R8): parent repository only, once compose.yaml
  # exists (branch main). Each service repository is checked out next to it, as on a laptop.
  stack:
    if: github.repository == 'Tunhoclaptrinh/smart-contract-services'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          path: btl-backend
      - id: has
        run: test -f btl-backend/compose.yaml && echo "compose=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.has.outputs.compose == 'true'
        name: Check out every service repository compose.yaml builds
        working-directory: btl-backend
        run: |
          for dir in $(grep -oE 'context: \.\./btl-backend-[a-z-]+' compose.yaml | sed 's#context: \.\./##' | sort -u); do
            git clone --depth 1 "https://github.com/Tunhoclaptrinh/smart-contract-services-${dir#btl-backend-}.git" "../${dir}"
          done
      - if: steps.has.outputs.compose == 'true'
        name: docker compose up
        working-directory: btl-backend
        run: docker compose up --build --wait --wait-timeout 240
      - if: steps.has.outputs.compose == 'true'
        name: Postman collection (Newman)
        working-directory: btl-backend
        run: >
          npx --yes newman@6 run postman/smart-contract.postman_collection.json
          -e postman/local.postman_environment.json --reporters cli
      - if: failure() && steps.has.outputs.compose == 'true'
        working-directory: btl-backend
        run: docker compose logs --no-color | tail -200
